name: Trinity Nano 4-bit 16k Context Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-trinity-nano:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama with 16k context
        run: |
          OLLAMA_CONTEXT_LENGTH=16384 ollama serve &
          sleep 10
          curl -s http://localhost:11434/api/tags

      - name: Pull Trinity Nano 4-bit model
        run: |
          ollama pull hf.co/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M
          ollama list

      - name: Verify context window is set to 16k
        run: |
          ollama ps

      - name: Download and prepare a long conversational text
        run: |
          # Download a public-domain play from Project Gutenberg (conversational)
          curl -s -o play.txt https://www.gutenberg.org/files/844/844-0.txt
          # Remove Project Gutenberg header/footer and normalize
          python3 -c "
          import re
          with open('play.txt', 'r', encoding='utf-8', errors='ignore') as f:
              text = f.read()
          # Remove Gutenberg header/footer
          start = text.find('*** START OF')
          end = text.find('*** END OF')
          if start != -1 and end != -1:
              text = text[start:end]
          # Clean up excessive whitespace
          text = re.sub(r'\s+', ' ', text).strip()
          with open('clean_play.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          "

      - name: Ensure text is within 14k-15k tokens
        run: |
          python3 -c "
          # Approximate: 1 token ≈ 0.75 words, so 14k tokens ≈ 10,500 words
          MIN_WORDS = 10500
          MAX_WORDS = 11250
          with open('clean_play.txt', 'r', encoding='utf-8') as f:
              text = f.read()
          words = text.split()
          print(f'Original word count: {len(words)}')
          if len(words) < MIN_WORDS:
              # Pad by repeating the text if too short
              print('Text too short, padding...')
              while len(words) < MIN_WORDS:
                  text += ' ' + text
                  words = text.split()
          elif len(words) > MAX_WORDS:
              # Truncate if too long
              print('Text too long, truncating...')
              text = ' '.join(words[:MAX_WORDS])
          with open('final_text.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          print(f'Final word count: {len(text.split())}')
          "

      - name: Run inference with 14k-15k token conversational prompt
        run: |
          python3 -c "
          with open('final_text.txt', 'r', encoding='utf-8') as f:
              long_text = f.read()
          prompt = long_text + '\n\nPlease summarize the main theme of this conversation in one sentence.'
          with open('prompt.txt', 'w', encoding='utf-8') as f:
              f.write(prompt)
          "
          echo "=== Testing with ~14k-15k token conversational prompt ==="
          time ollama run hf.co/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M < prompt.txt

      - name: Check memory usage and model info
        run: |
          echo "=== Ollama process memory usage ==="
          ps aux | grep ollama
          echo ""
          echo "=== Model info ==="
          ollama show hf.co/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M

      - name: Report context allocation
        run: |
          echo "=== Current context allocation ==="
          ollama ps
