name: Trinity Nano 4-bit 16k Context Test

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [main]

jobs:
  test-trinity-nano:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama with 16k context
        run: |
          OLLAMA_CONTEXT_LENGTH=16384 ollama serve &
          sleep 10
          curl -s http://localhost:11434/api/tags

      - name: Download Trinity Nano 4-bit GGUF file directly
        run: |
          # Direct download bypasses Ollama's registry redirect validation bug
          curl -L -o Trinity-Nano-Preview-Q4_K_M.gguf \
            "https://huggingface.co/arcee-ai/Trinity-Nano-Preview-GGUF/resolve/main/Trinity-Nano-Preview-Q4_K_M.gguf?download=true"
          ls -lh Trinity-Nano-Preview-Q4_K_M.gguf
          file Trinity-Nano-Preview-Q4_K_M.gguf

      - name: Create Modelfile and import model
        run: |
          cat > Modelfile << 'EOF'
          FROM ./Trinity-Nano-Preview-Q4_K_M.gguf
          PARAMETER temperature 0.7
          PARAMETER top_p 0.9
          PARAMETER num_ctx 16384
          EOF

          ollama create trinity-nano-4bit -f Modelfile
          ollama list
          ollama show trinity-nano-4bit

      - name: Verify context window is set to 16k
        run: |
          ollama ps

      - name: Download and prepare a long conversational text
        run: |
          curl -s -o play.txt https://www.gutenberg.org/files/844/844-0.txt
          python3 -c "
          import re
          with open('play.txt', 'r', encoding='utf-8', errors='ignore') as f:
              text = f.read()
          start = text.find('*** START OF')
          end = text.find('*** END OF')
          if start != -1 and end != -1:
              text = text[start:end]
          text = re.sub(r'\s+', ' ', text).strip()
          with open('clean_play.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          "

      - name: Ensure text is within 14k-15k tokens
        run: |
          python3 -c "
          MIN_WORDS = 10500
          MAX_WORDS = 11250
          with open('clean_play.txt', 'r', encoding='utf-8') as f:
              text = f.read()
          words = text.split()
          print(f'Original word count: {len(words)}')
          if len(words) < MIN_WORDS:
              print('Text too short, padding...')
              while len(words) < MIN_WORDS:
                  text += ' ' + text
                  words = text.split()
          elif len(words) > MAX_WORDS:
              print('Text too long, truncating...')
              text = ' '.join(words[:MAX_WORDS])
          with open('final_text.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          print(f'Final word count: {len(text.split())}')
          "

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Run streaming inference with token/sec measurement
        run: |
          python3 -c "
          with open('final_text.txt', 'r', encoding='utf-8') as f:
              long_text = f.read()
          with open('prompt.txt', 'w', encoding='utf-8') as f:
              f.write(long_text + '\n\nPlease summarize the main theme of this conversation in one sentence.')
          "

          cat > benchmark.py << 'PYEOF'
          import json, time, threading, subprocess, requests, sys

          # ---------- Background resource monitor ----------
          samples = []
          stop_flag = threading.Event()

          def monitor():
              pid = None
              try:
                  out = subprocess.check_output(['pgrep', '-f', 'llama-server']).decode().strip()
                  if out:
                      pid = out.splitlines()[0]
              except Exception:
                  pass
              while not stop_flag.is_set():
                  try:
                      if pid:
                          ps = subprocess.check_output(
                              ['ps', '-p', pid, '-o', '%cpu=,rss=']
                          ).decode().strip().split()
                          cpu = float(ps[0])
                          rss_mb = int(ps[1]) / 1024.0
                      else:
                          cpu, rss_mb = 0.0, 0.0
                      samples.append((time.time(), cpu, rss_mb))
                  except Exception:
                      pass
                  time.sleep(0.5)

          monitor_thread = threading.Thread(target=monitor, daemon=True)
          monitor_thread.start()

          # ---------- Streaming inference ----------
          with open('prompt.txt') as f:
              prompt = f.read()

          payload = {
              'model': 'trinity-nano-4bit',
              'prompt': prompt,
              'stream': True,
              'options': {'num_ctx': 16384}
          }

          print('=== Streaming response ===')
          start = time.time()
          first_token_time = None
          token_count = 0

          with requests.post('http://localhost:11434/api/generate',
                             json=payload, stream=True, timeout=3600) as r:
              r.raise_for_status()
              for line in r.iter_lines():
                  if not line:
                      continue
                  chunk = json.loads(line)
                  if 'response' in chunk and chunk['response']:
                      if first_token_time is None:
                          first_token_time = time.time()
                      token_count += 1
                      sys.stdout.write(chunk['response'])
                      sys.stdout.flush()
                  if chunk.get('done'):
                      break

          end = time.time()
          stop_flag.set()
          monitor_thread.join(timeout=2)

          # ---------- Metrics ----------
          total_time = end - start
          gen_time = end - first_token_time if first_token_time else total_time
          ttft = (first_token_time - start) if first_token_time else None

          print()
          print('=== Metrics ===')
          print(f'Total wall time:        {total_time:.2f} s')
          if ttft is not None:
              print(f'Time to first token:    {ttft:.2f} s')
          print(f'Generated tokens:       {token_count}')
          print(f'Generation tok/s:       {token_count / gen_time:.2f}')
          print(f'End-to-end tok/s:       {token_count / total_time:.2f}')

          if samples:
              cpus = [s[1] for s in samples]
              rams = [s[2] for s in samples]
              print()
              print('=== Resource usage during inference ===')
              print(f'Samples:                {len(samples)}')
              print(f'CPU  avg / peak:        {sum(cpus)/len(cpus):.1f}% / {max(cpus):.1f}%')
              print(f'RAM  avg / peak:        {sum(rams)/len(rams):.0f} MB / {max(rams):.0f} MB')
          PYEOF

          python3 benchmark.py | tee benchmark_output.txt

      - name: Ollama native metrics (verbose)
        run: |
          echo "=== Ollama native --verbose metrics ==="
          time ollama run trinity-nano-4bit --verbose < prompt.txt

      - name: Check memory usage and model info
        run: |
          echo "=== Ollama process memory usage ==="
          ps aux | grep ollama
          echo ""
          echo "=== Model info ==="
          ollama show trinity-nano-4bit

      - name: Report context allocation
        run: |
          echo "=== Current context allocation ==="
          ollama ps

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trinity-nano-benchmark
          path: |
            benchmark_output.txt
            prompt.txt
            final_text.txt
          retention-days: 7
