name: Trinity Nano MoE Server

on:
  workflow_dispatch:

jobs:
  trinity:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. SYSTEM INFO
      # ============================================================
      - name: System information
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SYSTEM INFORMATION"
          echo "========================================"

          uname -a
          echo

          echo "--- CPU ---"
          lscpu | grep -E \
            'Model name|CPU\(s\)|Thread|Core|Socket|MHz' || true

          echo
          echo "--- MEMORY ---"
          free -h

          echo
          echo "--- DISK ---"
          df -h

          echo
          echo "--- OS ---"
          cat /etc/os-release

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            curl \
            jq \
            python3 \
            python3-pip \
            procps

      # ============================================================
      # 3. BUILD LATEST LLAMA.CPP
      #
      # Trinity Nano requires a recent llama.cpp with AFMOE
      # support. The official model card specifies b7061+.
      # ============================================================
      - name: Build llama.cpp
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "CLONING LLAMA.CPP"
          echo "========================================"

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git

          cd llama.cpp

          echo
          echo "llama.cpp commit:"
          git rev-parse HEAD

          echo
          echo "Building..."

          cmake \
            -S . \
            -B build \
            -DGGML_NATIVE=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build build \
            --config Release \
            --target llama-server llama-cli \
            -j2

          echo
          echo "========================================"
          echo "LLAMA.CPP BUILT"
          echo "========================================"

          ./build/bin/llama-server --version || true

      # ============================================================
      # 4. LOCATE LLAMA SERVER
      # ============================================================
      - name: Set llama.cpp paths
        shell: bash
        run: |
          set -e

          echo "LLAMA_SERVER=$GITHUB_WORKSPACE/llama.cpp/build/bin/llama-server" \
            >> "$GITHUB_ENV"

          echo "LLAMA_CLI=$GITHUB_WORKSPACE/llama.cpp/build/bin/llama-cli" \
            >> "$GITHUB_ENV"

          echo "MODEL_REPO=arcee-ai/Trinity-Nano-Preview-GGUF" \
            >> "$GITHUB_ENV"

          echo "MODEL_QUANT=Q4_K_M" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 5. DOWNLOAD MODEL
      #
      # Using llama.cpp's HF downloader avoids manually guessing
      # the exact Hugging Face resolve URL.
      # ============================================================
      - name: Download Trinity Nano Q4_K_M
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/models"

          echo "========================================"
          echo "DOWNLOADING TRINITY NANO"
          echo "========================================"

          "$LLAMA_SERVER" \
            -hf "${MODEL_REPO}:${MODEL_QUANT}" \
            --help > /dev/null

          echo
          echo "Model download/cache preparation complete."

          echo
          echo "Cache:"
          du -sh "$HOME/.cache/huggingface" 2>/dev/null || true
          du -sh "$HOME/.cache" 2>/dev/null || true

      # ============================================================
      # 6. START SERVER
      #
      # Start at 16K first.
      #
      # We can later increase this after measuring RAM.
      # ============================================================
      - name: Start Trinity Nano server
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING TRINITY NANO"
          echo "========================================"

          "$LLAMA_SERVER" \
            -hf "${MODEL_REPO}:${MODEL_QUANT}" \
            --host 0.0.0.0 \
            --port 8080 \
            -c 16384 \
            -t 4 \
            --temp 0.15 \
            --top-k 50 \
            --top-p 0.75 \
            --min-p 0.06 \
            > llama-server.log 2>&1 &

          echo $! > llama-server.pid

          echo "Server PID:"
          cat llama-server.pid

          echo
          echo "Waiting for server..."

          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "Server is ready."
              break
            fi

            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then
              echo
              echo "SERVER DIED"
              echo
              cat llama-server.log
              exit 1
            fi

            sleep 2
          done

          if ! curl -sf http://127.0.0.1:8080/health > /dev/null; then
            echo "Server failed to become ready."
            echo
            cat llama-server.log
            exit 1
          fi

      # ============================================================
      # 7. VERIFY MODEL / CONTEXT
      # ============================================================
      - name: Verify server properties
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SERVER PROPERTIES"
          echo "========================================"

          curl -s http://127.0.0.1:8080/props | jq .

          echo
          echo "========================================"
          echo "IMPORTANT CONTEXT VALUES"
          echo "========================================"

          PROPS=$(curl -s http://127.0.0.1:8080/props)

          echo "$PROPS" | jq -r \
            '.default_generation_settings.n_ctx // "unknown"' \
            | tee actual_context.txt

          echo
          echo "Model path:"
          echo "$PROPS" | jq -r \
            '.model_path // .model_alias // "unknown"'

          echo
          echo "Server arguments:"
          echo "$PROPS" | jq -r \
            '.default_generation_settings // {}'

      # ============================================================
      # 8. MEMORY BEFORE BENCHMARK
      # ============================================================
      - name: Memory snapshot before tests
        shell: bash
        run: |
          echo "========================================"
          echo "MEMORY BEFORE TESTS"
          echo "========================================"

          free -h

          echo
          echo "--- Server process ---"

          PID=$(cat llama-server.pid)

          ps -o \
            pid,ppid,%cpu,%mem,rss,vsz,etime,cmd \
            -p "$PID" || true

      # ============================================================
      # 9. SIMPLE CHAT TEST
      # ============================================================
      - name: Basic chat test
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BASIC CHAT TEST"
          echo "========================================"

          START=$(date +%s.%N)

          RESPONSE=$(curl -s \
            --max-time 180 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "trinity-nano",
              "messages": [
                {
                  "role": "user",
                  "content": "Explain why the sky is blue in a concise technical answer."
                }
              ],
              "max_tokens": 200,
              "temperature": 0.15,
              "stream": false
            }')

          END=$(date +%s.%N)

          echo
          echo "Response:"
          echo "$RESPONSE" | jq .

          echo
          echo "Elapsed:"
          awk "BEGIN {print $END - $START, \"seconds\"}"

      # ============================================================
      # 10. 10-REQUEST GENERATION BENCHMARK
      #
      # Same basic methodology as our Qwen/OLMoE tests.
      # 400 output tokens x 10 requests.
      # ============================================================
      - name: 10 request speed benchmark
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "10 REQUEST BENCHMARK"
          echo "========================================"

          RESULTS="benchmark_results.jsonl"

          rm -f "$RESULTS"

          TOTAL_TOKENS=0
          TOTAL_SECONDS=0
          SUCCESS=0

          for i in $(seq 1 10); do

            echo
            echo "----------------------------------------"
            echo "TEST $i / 10"
            echo "----------------------------------------"

            START=$(date +%s.%N)

            RESPONSE=$(curl -s \
              --max-time 180 \
              http://127.0.0.1:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "trinity-nano",
                "messages": [
                  {
                    "role": "user",
                    "content": "Explain the engineering tradeoffs between a mixture-of-experts language model and a dense language model. Be technically precise and concise."
                  }
                ],
                "max_tokens": 400,
                "temperature": 0.15,
                "stream": false
              }')

            END=$(date +%s.%N)

            ELAPSED=$(awk \
              "BEGIN {print $END - $START}")

            TOKENS=$(echo "$RESPONSE" | \
              jq -r '.usage.completion_tokens // 0')

            if [ "$TOKENS" -gt 0 ]; then

              SPEED=$(awk \
                "BEGIN {print $TOKENS / $ELAPSED}")

              echo "tokens:  $TOKENS"
              echo "time:    $ELAPSED sec"
              echo "speed:   $SPEED tok/s"

              jq -nc \
                --argjson test "$i" \
                --argjson tokens "$TOKENS" \
                --argjson seconds "$ELAPSED" \
                --argjson tokps "$SPEED" \
                '{
                  test: $test,
                  completion_tokens: $tokens,
                  seconds: $seconds,
                  tok_per_second: $tokps
                }' \
                >> "$RESULTS"

              TOTAL_TOKENS=$((TOTAL_TOKENS + TOKENS))

              TOTAL_SECONDS=$(awk \
                "BEGIN {print $TOTAL_SECONDS + $ELAPSED}")

              SUCCESS=$((SUCCESS + 1))

            else
              echo "FAILED REQUEST"
              echo "$RESPONSE"
            fi

          done

          echo
          echo "========================================"
          echo "BENCHMARK SUMMARY"
          echo "========================================"

          AVG=$(awk \
            "BEGIN { \
              if ($TOTAL_SECONDS > 0) \
                print $TOTAL_TOKENS / $TOTAL_SECONDS; \
              else \
                print 0 \
            }")

          echo "Successful requests: $SUCCESS / 10"
          echo "Total tokens:         $TOTAL_TOKENS"
          echo "Total seconds:        $TOTAL_SECONDS"
          echo "Average tok/s:        $AVG"

          jq -n \
            --argjson success "$SUCCESS" \
            --argjson total_tokens "$TOTAL_TOKENS" \
            --argjson total_seconds "$TOTAL_SECONDS" \
            --argjson average_tokps "$AVG" \
            '{
              successful_requests: $success,
              total_tokens: $total_tokens,
              total_seconds: $total_seconds,
              average_tok_per_second: $average_tokps
            }' \
            > benchmark_summary.json

          echo
          cat benchmark_summary.json

      # ============================================================
      # 11. GENERATE LARGE CONTEXT DATA
      #
      # We deliberately generate a known amount of text rather than
      # blindly repeating a paragraph thousands of times.
      #
      # The server's tokenizer/usage numbers will tell us the real
      # token count.
      # ============================================================
      - name: Generate context test data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          block = """
          The experimental system consists of multiple autonomous
          language-model agents working inside a shared engineering
          workspace. Each agent may inspect source files, modify code,
          execute tests, collect benchmark results, and write conclusions.
          The objective is to compare different model architectures under
          identical compute constraints. Particular attention is given to
          inference throughput, context length, memory consumption,
          prompt processing speed, generation speed, and reliability.
          Mixture-of-experts architectures are especially interesting
          because only a subset of expert parameters are activated for
          each token while the complete model remains available.
          """

          text = (block.strip() + "\n\n") * 35

          Path("large_context.txt").write_text(text)

          print("Characters:", len(text))
          print("Approx KB:", len(text) / 1024)
          PY

          echo
          echo "Context file:"
          wc -c large_context.txt

      # ============================================================
      # 12. 16K CONTEXT TEST
      # ============================================================
      - name: 16K context test
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "16K CONTEXT TEST"
          echo "========================================"

          python3 <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          context = Path("large_context.txt").read_text()

          # Keep the initial test comfortably below 16K.
          # The actual token count will be reported by llama.cpp.
          prompt = context

          payload = {
              "model": "trinity-nano",
              "messages": [
                  {
                      "role": "user",
                      "content":
                          "Read the following engineering research notes. "
                          "Summarize the main architectural objective, "
                          "the benchmark dimensions, and the expected "
                          "advantages of MoE models.\n\n" + prompt
                  }
              ],
              "max_tokens": 200,
              "temperature": 0.15,
              "stream": False
          }

          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=300) as r:
                  result = json.loads(r.read())

              print(json.dumps(result, indent=2))

              usage = result.get("usage", {})
              print()
              print("Prompt tokens:",
                    usage.get("prompt_tokens"))
              print("Completion tokens:",
                    usage.get("completion_tokens"))
              print("Total tokens:",
                    usage.get("total_tokens"))

          except Exception as e:
              print("16K TEST FAILED")
              print(e)
              raise
          PY

      # ============================================================
      # 13. MEMORY AFTER 16K
      # ============================================================
      - name: Memory after 16K test
        shell: bash
        run: |
          echo "========================================"
          echo "MEMORY AFTER 16K"
          echo "========================================"

          free -h

          PID=$(cat llama-server.pid)

          echo
          ps -o \
            pid,%cpu,%mem,rss,vsz,etime,cmd \
            -p "$PID" || true

      # ============================================================
      # 14. 32K SERVER RESTART
      # ============================================================
      - name: Restart server at 32K context
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RESTARTING AT 32K CONTEXT"
          echo "========================================"

          kill "$(cat llama-server.pid)" || true

          sleep 3

          "$LLAMA_SERVER" \
            -hf "${MODEL_REPO}:${MODEL_QUANT}" \
            --host 0.0.0.0 \
            --port 8080 \
            -c 32768 \
            -t 4 \
            --temp 0.15 \
            --top-k 50 \
            --top-p 0.75 \
            --min-p 0.06 \
            > llama-server-32k.log 2>&1 &

          echo $! > llama-server.pid

          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "32K server ready."
              break
            fi

            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then
              echo "Server died."
              cat llama-server-32k.log
              exit 1
            fi

            sleep 2
          done

          curl -sf http://127.0.0.1:8080/health > /dev/null

          echo
          echo "Actual context:"
          curl -s http://127.0.0.1:8080/props | \
            jq '.default_generation_settings.n_ctx'

      # ============================================================
      # 15. 32K TEST
      #
      # We create a larger context by repeating the source material.
      # The test stops cleanly if the runner cannot handle it.
      # ============================================================
      - name: 32K context test
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "32K CONTEXT TEST"
          echo "========================================"

          python3 <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          base = Path("large_context.txt").read_text()

          # Bigger than the 16K test.
          context = (base + "\n\n") * 2

          payload = {
              "model": "trinity-nano",
              "messages": [
                  {
                      "role": "user",
                      "content":
                          "Analyze the following research notes and "
                          "produce a concise technical summary. "
                          "Identify recurring themes and architectural "
                          "tradeoffs.\n\n" + context
                  }
              ],
              "max_tokens": 200,
              "temperature": 0.15,
              "stream": False
          }

          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=600) as r:
                  result = json.loads(r.read())

              print(json.dumps(result, indent=2))

              usage = result.get("usage", {})

              print()
              print("Prompt tokens:",
                    usage.get("prompt_tokens"))
              print("Completion tokens:",
                    usage.get("completion_tokens"))

          except Exception as e:
              print("32K TEST FAILED:")
              print(e)
          PY

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # 16. MEMORY AFTER 32K
      # ============================================================
      - name: Memory after 32K test
        shell: bash
        run: |
          echo "========================================"
          echo "MEMORY AFTER 32K"
          echo "========================================"

          free -h

          PID=$(cat llama-server.pid)

          ps -o \
            pid,%cpu,%mem,rss,vsz,etime,cmd \
            -p "$PID" || true

      # ============================================================
      # 17. RESTART AT 64K
      # ============================================================
      - name: Restart server at 64K
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RESTARTING AT 64K"
          echo "========================================"

          kill "$(cat llama-server.pid)" || true

          sleep 3

          "$LLAMA_SERVER" \
            -hf "${MODEL_REPO}:${MODEL_QUANT}" \
            --host 0.0.0.0 \
            --port 8080 \
            -c 65536 \
            -t 4 \
            --temp 0.15 \
            --top-k 50 \
            --top-p 0.75 \
            --min-p 0.06 \
            > llama-server-64k.log 2>&1 &

          echo $! > llama-server.pid

          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "64K server ready."
              break
            fi

            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then
              echo "Server died during 64K startup."

              cat llama-server-64k.log

              exit 1
            fi

            sleep 2
          done

          curl -sf http://127.0.0.1:8080/health > /dev/null

          echo
          echo "Actual context:"
          curl -s http://127.0.0.1:8080/props | \
            jq '.default_generation_settings.n_ctx'

      # ============================================================
      # 18. 64K CONTEXT TEST
      # ============================================================
      - name: 64K context test
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "64K CONTEXT TEST"
          echo "========================================"

          python3 <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          base = Path("large_context.txt").read_text()

          context = (base + "\n\n") * 4

          payload = {
              "model": "trinity-nano",
              "messages": [
                  {
                      "role": "user",
                      "content":
                          "You are evaluating a large engineering "
                          "research corpus. Read the following material "
                          "and provide a concise synthesis of the most "
                          "important technical conclusions.\n\n"
                          + context
                  }
              ],
              "max_tokens": 200,
              "temperature": 0.15,
              "stream": False
          }

          req = urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=900) as r:
                  result = json.loads(r.read())

              print(json.dumps(result, indent=2))

              usage = result.get("usage", {})

              print()
              print("Prompt tokens:",
                    usage.get("prompt_tokens"))
              print("Completion tokens:",
                    usage.get("completion_tokens"))

          except Exception as e:
              print("64K TEST FAILED:")
              print(e)
          PY

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # 19. CLOUDFLARE QUICK TUNNEL
      # ============================================================
      - name: Install cloudflared
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL CLOUDFLARED"
          echo "========================================"

          curl -L \
            --fail \
            --silent \
            --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          ./cloudflared --version

      # ============================================================
      # 20. START CLOUDFLARE
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING CLOUDFLARE TUNNEL"
          echo "========================================"

          ./cloudflared tunnel \
            --url http://localhost:8080 \
            --http-host-header="localhost:8080" \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo
          echo "Waiting for tunnel..."

          for i in $(seq 1 60); do

            URL=$(grep -o \
              'https://[-a-zA-Z0-9]*\.trycloudflare\.com' \
              cloudflared.log \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$URL" ]; then
            echo "Cloudflare tunnel failed."

            cat cloudflared.log

            exit 1
          fi

          echo
          echo "========================================"
          echo "PUBLIC URL"
          echo "========================================"

          echo "$URL"

          echo "$URL" > cloudflare_url.txt

          echo "CLOUDFLARE_URL=$URL" >> "$GITHUB_ENV"

      # ============================================================
      # 21. PUBLIC API TEST
      # ============================================================
      - name: Test public API
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PUBLIC API TEST"
          echo "========================================"

          echo "URL:"
          echo "$CLOUDFLARE_URL"

          echo
          echo "Testing /health..."

          curl -s \
            --max-time 60 \
            "$CLOUDFLARE_URL/health"

          echo
          echo
          echo "Testing OpenAI-compatible endpoint..."

          START=$(date +%s.%N)

          RESPONSE=$(curl -s \
            --max-time 300 \
            "$CLOUDFLARE_URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d '{
              "model": "trinity-nano",
              "messages": [
                {
                  "role": "user",
                  "content": "Give me five concise facts about mixture-of-experts language models."
                }
              ],
              "max_tokens": 200,
              "temperature": 0.15,
              "stream": false
            }')

          END=$(date +%s.%N)

          echo
          echo "Response:"
          echo "$RESPONSE" | jq .

          echo
          echo "Elapsed:"
          awk "BEGIN {print $END - $START, \"seconds\"}"

      # ============================================================
      # 22. SAVE FINAL SERVER STATE
      # ============================================================
      - name: Final diagnostics
        shell: bash
        run: |
          echo "========================================"
          echo "FINAL DIAGNOSTICS"
          echo "========================================"

          echo
          echo "--- MEMORY ---"
          free -h

          echo
          echo "--- SERVER PROPS ---"
          curl -s http://127.0.0.1:8080/props | jq .

          echo
          echo "--- SERVER PROCESS ---"

          PID=$(cat llama-server.pid)

          ps -o \
            pid,ppid,%cpu,%mem,rss,vsz,etime,cmd \
            -p "$PID" || true

          echo
          echo "--- DISK ---"
          df -h

          echo
          echo "--- CLOUDflare URL ---"
          cat cloudflare_url.txt || true

      # ============================================================
      # 23. UPLOAD RESULTS
      # ============================================================
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trinity-nano-results
          path: |
            benchmark_results.jsonl
            benchmark_summary.json
            actual_context.txt
            large_context.txt
            llama-server.log
            llama-server-32k.log
            llama-server-64k.log
            cloudflared.log
            cloudflare_url.txt
          if-no-files-found: warn

      # ============================================================
      # 24. KEEP SERVER ALIVE
      # ============================================================
      - name: Keep server alive
        shell: bash
        run: |
          echo "========================================"
          echo "TRINITY NANO SERVER IS ONLINE"
          echo "========================================"

          echo
          echo "Public API:"
          echo "$CLOUDFLARE_URL/v1"

          echo
          echo "OpenAI-compatible endpoint:"
          echo "$CLOUDFLARE_URL/v1/chat/completions"

          echo
          echo "Health:"
          echo "$CLOUDFLARE_URL/health"

          echo
          echo "Keeping runner alive for 15 minutes..."

          for i in $(seq 1 15); do

            echo
            echo "[$i/15] $(date)"

            if ! kill -0 "$(cat llama-server.pid)" 2>/dev/null; then
              echo "llama-server died."

              cat llama-server.log || true
              cat llama-server-32k.log || true
              cat llama-server-64k.log || true

              exit 1
            fi

            echo "Server alive."

            free -h | head -n 2

            sleep 60

          done

          echo
          echo "Keep-alive finished."
