name: LLM Benchmark - OLMoE 1B-7B Q4_K_M 16K

on:
  workflow_dispatch:

jobs:
  run-llama:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Show Runner Hardware
      # ------------------------------------------------------------
      - name: Check Runner Hardware
        run: |
          echo "=========================================="
          echo "RUNNER HARDWARE"
          echo "=========================================="

          echo ""
          echo "CPU:"
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|MHz'

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "GPU:"
          lspci | grep -Ei 'vga|3d|nvidia|amd' || true

          echo ""
          echo "=========================================="


      # ------------------------------------------------------------
      # 3. Install llama.cpp
      # ------------------------------------------------------------
      - name: Install llama.cpp
        run: |
          set -e

          echo "Downloading llama.cpp..."

          mkdir -p "$HOME/llama"

          RELEASE_URL=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest \
            | jq -r '.assets[] | select(.name | test("ubuntu.*x64.*\\.tar\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$RELEASE_URL" ]; then

            echo "Could not find llama.cpp Linux x64 release."
            echo "Falling back to source build."

            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

            cmake -S llama.cpp -B llama.cpp/build \
              -DGGML_NATIVE=ON

            cmake --build llama.cpp/build \
              --config Release \
              -j2

            LLAMA_SERVER="$GITHUB_WORKSPACE/llama.cpp/build/bin/llama-server"

          else

            echo "Release:"
            echo "$RELEASE_URL"

            curl -L "$RELEASE_URL" \
              -o /tmp/llama.tar.gz

            tar -xzf /tmp/llama.tar.gz \
              -C "$HOME/llama" \
              --strip-components=1

            LLAMA_SERVER=$(find "$HOME/llama" \
              -type f \
              -name "llama-server" \
              | head -n 1)

          fi

          if [ ! -x "$LLAMA_SERVER" ]; then
            echo "llama-server not found!"
            exit 1
          fi

          echo ""
          echo "llama-server:"
          "$LLAMA_SERVER" --version

          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 4. Download OLMoE
      #
      # Model:
      # OLMoE-1B-7B-0924-Instruct
      #
      # Total parameters: ~7B
      # Active parameters: ~1B
      # Quantization: Q4_K_M
      #
      # Official GGUF:
      # allenai/OLMoE-1B-7B-0924-Instruct-GGUF
      # ------------------------------------------------------------
      - name: Download OLMoE 1B-7B Q4_K_M
        run: |
          set -e

          echo "=========================================="
          echo "MODEL"
          echo "=========================================="
          echo "OLMoE-1B-7B-0924-Instruct"
          echo "Architecture: Mixture of Experts"
          echo "Total parameters: ~7B"
          echo "Active parameters: ~1B"
          echo "Quantization: Q4_K_M"
          echo "Context target: 16K"
          echo "=========================================="

          mkdir -p "$HOME/models"

          MODEL_URL="https://huggingface.co/allenai/OLMoE-1B-7B-0924-Instruct-GGUF/resolve/main/olmoe-1b-7b-0924-instruct-q4_k_m.gguf"

          MODEL_PATH="$HOME/models/olmoe-1b-7b-0924-instruct-q4_k_m.gguf"

          echo ""
          echo "Downloading:"
          echo "$MODEL_URL"
          echo ""

          curl -L \
            --fail \
            --progress-bar \
            "$MODEL_URL" \
            -o "$MODEL_PATH"

          echo ""
          echo "Downloaded model:"
          ls -lh "$HOME/models"

          if [ ! -f "$MODEL_PATH" ]; then
            echo "ERROR: Model download failed."
            exit 1
          fi

          echo ""
          echo "Model successfully downloaded."

          echo ""
          echo "Model size:"
          du -h "$MODEL_PATH"

          echo ""
          echo "RAM before loading:"
          free -h


            # ------------------------------------------------------------
      # 5. Start llama.cpp Server
      #
      # IMPORTANT:
      # Actual 16K context.
      # ------------------------------------------------------------
      - name: Start OLMoE Server
        run: |
          set -e

          MODEL="$HOME/models/olmoe-1b-7b-0924-instruct-q4_k_m.gguf"

          echo "=========================================="
          echo "STARTING OLMoE"
          echo "=========================================="

          echo "Model:"
          echo "$MODEL"

          echo ""
          echo "Context:"
          echo "16384"

          echo ""
          echo "Threads:"
          echo "4"

          "$LLAMA_SERVER" \
            -m "$MODEL" \
            --host 0.0.0.0 \
            --port 8080 \
            -c 16384 \
            -t 4 \
            > llama-server.log 2>&1 &

          echo $! > llama-server.pid

          echo "Server PID:"
          cat llama-server.pid

          echo ""
          echo "Waiting for llama.cpp..."

          READY=0

          for i in {1..120}; do

            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "llama.cpp is ready!"
              READY=1
              break
            fi

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "ERROR: llama.cpp did not become ready."

            echo ""
            echo "SERVER LOG:"
            tail -n 200 llama-server.log

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SERVER PROPERTIES"
          echo "=========================================="

          curl -s http://localhost:8080/props | jq .

          echo ""
          echo "=========================================="
          echo "MEMORY"
          echo "=========================================="

          free -h

          echo ""
          echo "=========================================="
          echo "SERVER LOG"
          echo "=========================================="

          tail -n 150 llama-server.log


      # ------------------------------------------------------------
      # 6. Inspect model + RAM
      # ------------------------------------------------------------
      - name: Check OLMoE Server
        run: |

          echo "=========================================="
          echo "SERVER PROPERTIES"
          echo "=========================================="

          curl -s http://localhost:8080/props | jq .

          echo ""
          echo "=========================================="
          echo "HEALTH"
          echo "=========================================="

          curl -s http://localhost:8080/health

          echo ""

          echo ""
          echo "=========================================="
          echo "MEMORY AFTER MODEL LOAD"
          echo "=========================================="

          free -h

          echo ""
          echo "=========================================="
          echo "PROCESS MEMORY"
          echo "=========================================="

          ps aux --sort=-%mem | head -n 10


      # ------------------------------------------------------------
      # 7. Benchmark
      #
      # Same 400-token generation workload as Qwen2.5-3B.
      #
      # This lets us directly compare:
      #
      # Qwen2.5 3B dense  -> ~16 tok/s
      #
      # OLMoE ~1B active  -> ??? tok/s
      # ------------------------------------------------------------
      - name: Run OLMoE Benchmark
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "       OLMoE 1B-7B Q4_K_M LLAMA.CPP BENCHMARK"
          echo "============================================================"

          echo ""
          echo "Context:"
          echo "16384 tokens"

          echo ""
          echo "Generation target:"
          echo "400 tokens"

          echo ""
          echo "Architecture:"
          echo "MoE / ~7B total / ~1B active"

          echo ""

          TOTAL_TOKENS=0
          TOTAL_GENERATION_TIME=0
          SUCCESS=0

          for i in {1..10}; do

            echo ""
            echo "------------------------------------------------------------"
            echo "TEST $i"
            echo "------------------------------------------------------------"

            START=$(date +%s.%N)

            RESPONSE=$(curl -s \
              --max-time 180 \
              -X POST \
              http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "olmoe-1b-7b-0924-instruct-q4_k_m.gguf",
                "messages": [
                  {
                    "role": "user",
                    "content": "Explain in detail how photosynthesis works, including the light-dependent reactions, photosystems, ATP, NADPH, Calvin cycle, and carbon fixation. Give a clear technical explanation."
                  }
                ],
                "temperature": 0.2,
                "max_tokens": 400,
                "stream": false
              }')

            END=$(date +%s.%N)

            TOTAL_TIME=$(awk "BEGIN {print $END - $START}")

            if echo "$RESPONSE" \
              | jq -e '.choices[0].message.content' \
              > /dev/null 2>&1; then

              TOKENS=$(echo "$RESPONSE" \
                | jq -r '.usage.completion_tokens // 0')

              if [ "$TOKENS" -gt 0 ]; then

                TPS=$(awk \
                  "BEGIN {printf \"%.2f\", $TOKENS / $TOTAL_TIME}")

                echo "Output tokens : $TOKENS"
                echo "Total time    : ${TOTAL_TIME}s"
                echo "Approx TPS    : $TPS"

                TOTAL_TOKENS=$((TOTAL_TOKENS + TOKENS))

                TOTAL_GENERATION_TIME=$(awk \
                  "BEGIN {print $TOTAL_GENERATION_TIME + $TOTAL_TIME}")

                SUCCESS=$((SUCCESS + 1))

              else

                echo "WARNING: No token count returned."

              fi

            else

              echo "ERROR:"
              echo "$RESPONSE" | jq . || echo "$RESPONSE"

            fi

          done


          echo ""
          echo "============================================================"
          echo "FINAL RESULTS"
          echo "============================================================"

          echo "Successful requests : $SUCCESS / 10"
          echo "Total tokens        : $TOTAL_TOKENS"
          echo "Total time          : ${TOTAL_GENERATION_TIME}s"

          if [ "$TOTAL_TOKENS" -gt 0 ]; then

            AVG_TPS=$(awk \
              "BEGIN {printf \"%.2f\", $TOTAL_TOKENS / $TOTAL_GENERATION_TIME}")

            echo ""
            echo "=========================================="
            echo "AVERAGE THROUGHPUT"
            echo "=========================================="
            echo "$AVG_TPS tokens/sec"

            echo ""
            echo "=========================================="
            echo "COMPARISON"
            echo "=========================================="
            echo "Qwen2.5 0.5B Q4_K_M : ~49 tok/s"
            echo "Qwen2.5 3B Q4_K_M   : ~16 tok/s"
            echo "OLMoE ~1B active    : $AVG_TPS tok/s"
            echo "=========================================="

          fi


      # ------------------------------------------------------------
      # 8. REAL 16K CONTEXT TEST
      #
      # Server is configured for 16384 tokens.
      #
      # We intentionally target ~14K-15K input tokens rather
      # than accidentally creating a 23K-token request.
      # ------------------------------------------------------------
      - name: Run 16K Context Test
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "              REAL 16K CONTEXT TEST"
          echo "============================================================"

          echo ""
          echo "Checking server context..."

          PROPS=$(curl -s http://localhost:8080/props)

          echo "$PROPS" | jq .

          echo ""
          echo "Memory before long-context request:"
          free -h

          echo ""
          echo "Generating approximately 14K tokens of input..."

          python3 - <<'PY'
          text = """
          Photosynthesis is the biological process through which
          plants, algae, and certain microorganisms convert light
          energy into chemical energy.

          The process occurs primarily in chloroplasts and involves
          coordinated reactions between photosystems, electron
          transport chains, ATP synthase, NADPH production,
          the Calvin cycle, carbon fixation, and regulation of
          metabolic pathways.

          The light-dependent reactions occur in the thylakoid
          membranes. Photosystem II absorbs photons and contributes
          to the generation of an electrochemical proton gradient.
          Electrons move through an electron transport chain and
          ultimately contribute to NADPH production through
          Photosystem I.

          ATP synthase uses the proton gradient to produce ATP.
          The Calvin cycle occurs in the chloroplast stroma and
          uses ATP and NADPH to drive carbon fixation and the
          subsequent production of carbohydrate precursors.
          """

          # Generate a large but controlled document.
          #
          # We intentionally use much less text than the previous
          # test so the request remains below 16K tokens.
          with open("/tmp/long_context.txt", "w") as f:
              for i in range(210):
                  f.write(f"\nSECTION {i}\n")
                  f.write(text)

          print("Generated:")
          print("/tmp/long_context.txt")
          PY

          echo ""
          echo "Approximate character count:"

          wc -c /tmp/long_context.txt

          echo ""
          echo "Sending long-context request..."

          START=$(date +%s.%N)

          RESPONSE=$(jq -n \
            --rawfile context /tmp/long_context.txt \
            '{
              model: "olmoe-1b-7b-0924-instruct-q4_k_m.gguf",
              messages: [
                {
                  role: "user",
                  content: (
                    $context
                    + "\n\nBased on all of the material above, summarize the key biological mechanisms involved in photosynthesis."
                  )
                }
              ],
              temperature: 0.2,
              max_tokens: 200,
              stream: false
            }' \
            | curl -s \
              --max-time 600 \
              -X POST \
              http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              --data-binary @-)

          END=$(date +%s.%N)

          TOTAL_TIME=$(awk "BEGIN {print $END - $START}")

          echo ""
          echo "============================================================"
          echo "RESPONSE"
          echo "============================================================"

          echo "$RESPONSE" | jq .

          echo ""
          echo "Request time:"
          echo "${TOTAL_TIME}s"

          echo ""
          echo "Memory after long-context request:"
          free -h

          if echo "$RESPONSE" \
            | jq -e '.choices[0].message.content' \
            > /dev/null 2>&1; then

            echo ""
            echo "============================================================"
            echo "16K CONTEXT TEST: SUCCESS"
            echo "============================================================"

            echo ""
            echo "Prompt tokens:"
            echo "$RESPONSE" | jq -r '.usage.prompt_tokens // "unknown"'

            echo ""
            echo "Completion tokens:"
            echo "$RESPONSE" | jq -r '.usage.completion_tokens // "unknown"'

          else

            echo ""
            echo "============================================================"
            echo "16K CONTEXT TEST: FAILED"
            echo "============================================================"

            exit 1

          fi

      # ------------------------------------------------------------
      # 9. Start Cloudflare Quick Tunnel
      # ------------------------------------------------------------
      - name: Start Cloudflare Quick Tunnel
        run: |
          set -e

          echo "Installing cloudflared..."

          mkdir -p "$HOME/.local/bin"

          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$HOME/.local/bin/cloudflared"

          chmod +x "$HOME/.local/bin/cloudflared"

          export PATH="$HOME/.local/bin:$PATH"

          echo "Starting Cloudflare tunnel..."

          cloudflared tunnel \
            --url http://localhost:8080 \
            --http-host-header="localhost:8080" \
            > cloudflared.log 2>&1 &

          echo $! > cloudflared.pid

          echo "Waiting for tunnel..."

          sleep 8

          cat cloudflared.log

          TUNNEL_URL=$(grep \
            -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
            cloudflared.log \
            | head -n 1)

          if [ -z "$TUNNEL_URL" ]; then
            echo "Tunnel failed!"
            exit 1
          fi

          echo ""
          echo "============================================================"
          echo "PUBLIC OPENAI-COMPATIBLE ENDPOINT"
          echo "============================================================"

          echo "$TUNNEL_URL"

          echo ""
          echo "API:"
          echo "$TUNNEL_URL/v1/chat/completions"

          echo "============================================================"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 10. Test Public API
      # ------------------------------------------------------------
      - name: Test Public API
        run: |

          echo ""
          echo "Testing Cloudflare -> llama.cpp..."

          RESPONSE=$(curl -s \
            --max-time 120 \
            -X POST \
            "$TUNNEL_URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "olmoe-1b-7b-0924-instruct-q4_k_m.gguf",
              "messages": [
                {
                  "role": "user",
                  "content": "Explain why mixture-of-experts models can have many total parameters while using fewer active parameters for each token."
                }
              ],
              "temperature": 0.2,
              "max_tokens": 200,
              "stream": false
            }')

          echo "$RESPONSE" | jq .


      # ------------------------------------------------------------
      # 11. Keep Alive
      # ------------------------------------------------------------
      - name: Keep Workflow Alive
        run: |

          echo ""
          echo "============================================================"
          echo "              OLMoE SERVER IS LIVE"
          echo "============================================================"

          echo ""
          echo "Public endpoint:"
          echo "$TUNNEL_URL/v1/chat/completions"

          echo ""
          echo "Model:"
          echo "OLMoE-1B-7B-0924-Instruct Q4_K_M"

          echo ""
          echo "Architecture:"
          echo "MoE / ~7B total / ~1B active"

          echo ""
          echo "Context:"
          echo "16384 tokens"

          echo ""
          echo "The runner will remain alive for 15 minutes."

          echo "============================================================"

          sleep 900
