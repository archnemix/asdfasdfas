name: LLM Benchmark & Cloudflare Tunnel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-llm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Service
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 5 # Give it a few seconds to initialize

      - name: Pull and Run 0.5B Model (4-bit quantized)
        run: |
          # Qwen2.5:0.5b defaults to a highly optimized 4-bit quantization layout
          ollama pull qwen2.5:0.5b

      - name: Start Cloudflare Quick Tunnel (No Token Required)
        run: |
          echo "=== Downloading Cloudflare Standalone Binary ==="
          # Create local bin directory if it doesn't exist
          mkdir -p ~/.local/bin
          
          # FIXED: Download the actual direct standalone binary, NOT the .deb package
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o ~/.local/bin/cloudflared
          chmod +x ~/.local/bin/cloudflared
          
          # Append to PATH for the duration of this step
          export PATH="$HOME/.local/bin:$PATH"

          echo "=== Starting Anonymous Quick Tunnel ==="
          # Running 'tunnel' without tokens creates a free quick tunnel
          # Routes external traffic to Ollama's default local port (11434)
          cloudflared tunnel --url http://localhost:11434 > cloudflared.log 2>&1 &
          
          echo "=== Waiting for Public URL Generation ==="
          sleep 8
          
          # Extract and print the randomly generated .trycloudflare.com URL from logs
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflared.log | head -n 1)
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ ERROR: Failed to generate Cloudflare Tunnel URL. Check cloudflared.log below:"
            cat cloudflared.log
            exit 1
          fi
          
          echo "------------------------------------------------"
          echo "YOUR FREE ANONYMOUS URL IS:"
          echo "$TUNNEL_URL"
          echo "------------------------------------------------"
          
          # Save the URL to the global environment so subsequent steps can use it
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV


      - name: Run Benchmark Test (Token Throughput Evaluation)
        run: |
          echo "=== Testing Local Inference Speed ==="
          
          # Send a heavy prompt forcing a long generation sequence to calculate accurate tokens/sec
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d '{
            "model": "qwen2.5:0.5b",
            "prompt": "Write a 300-word essay detailing the cycle of water in nature.",
            "stream": false
          }')
          
          # Parse the evaluation metrics returned out-of-the-box by Ollama's API
          TOTAL_DURATION=$(echo "$RESPONSE" | jq '.total_duration')
          EVAL_COUNT=$(echo "$RESPONSE" | jq '.eval_count')
          EVAL_DURATION=$(echo "$RESPONSE" | jq '.eval_duration')
          
          # Convert nanoseconds to seconds for clear throughput calculation
          DURATION_SECS=$(echo "scale=2; $EVAL_DURATION / 1000000000" | bc)
          TOKENS_PER_SEC=$(echo "scale=2; $EVAL_COUNT / $DURATION_SECS" | bc)
          
          echo "Total Output Tokens Generated: $EVAL_COUNT"
          echo "Generation Time: $DURATION_SECS seconds"
          echo "----------------------------------------"
          echo "ACTUAL THROUGHPUT: $TOKENS_PER_SEC tokens/second"
          echo "----------------------------------------"

      - name: Keep Workflow Alive for External Prompts
        run: |
          echo "Tunnel is active. You can now prompt the endpoint externally via your Cloudflare URL."
          echo "This action will remain open for 15 minutes for live manual testing..."
          sleep 900 # Keeps the runner open for 15 minutes before terminating automatically
