name: Trinity Nano 4-bit 16k Context Test

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [main]

jobs:
  test-trinity-nano:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Generous timeout for model download and CPU inference

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama with 16k context
        run: |
          # Start Ollama server with a 16k default context length
          # This overrides the default 4k context window
          OLLAMA_CONTEXT_LENGTH=16384 ollama serve &
          sleep 10
          # Verify the server is running
          curl -s http://localhost:11434/api/tags

      - name: Pull Trinity Nano 4-bit model (via mirror)
        run: |
          # Using hf-mirror.com as a reliable workaround for the
          # "blocked redirect to a different host" error from the official hf.co endpoint.
          # See: https://github.com/ollama/ollama/issues/15661
          ollama pull hf-mirror.com/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M
          # Verify the model was downloaded
          ollama list

      - name: Verify context window is set to 16k
        run: |
          # The CONTEXT column in the output should show 16384
          ollama ps

      - name: Download and prepare a long conversational text
        run: |
          # Download a public-domain play from Project Gutenberg (The Importance of Being Earnest)
          # This play is entirely dialogue, making it a perfect conversational test case.
          curl -s -o play.txt https://www.gutenberg.org/files/844/844-0.txt
          # Remove Project Gutenberg header/footer and normalize whitespace
          python3 -c "
          import re
          with open('play.txt', 'r', encoding='utf-8', errors='ignore') as f:
              text = f.read()
          start = text.find('*** START OF')
          end = text.find('*** END OF')
          if start != -1 and end != -1:
              text = text[start:end]
          text = re.sub(r'\s+', ' ', text).strip()
          with open('clean_play.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          "

      - name: Ensure text is within 14k-15k tokens
        run: |
          python3 -c "
          # Approximate: 1 token ~ 0.75 words, so 14k tokens ~ 10,500 words
          MIN_WORDS = 10500
          MAX_WORDS = 11250
          with open('clean_play.txt', 'r', encoding='utf-8') as f:
              text = f.read()
          words = text.split()
          print(f'Original word count: {len(words)}')
          if len(words) < MIN_WORDS:
              print('Text too short, padding...')
              while len(words) < MIN_WORDS:
                  text += ' ' + text
                  words = text.split()
          elif len(words) > MAX_WORDS:
              print('Text too long, truncating...')
              text = ' '.join(words[:MAX_WORDS])
          with open('final_text.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          print(f'Final word count: {len(text.split())}')
          "

      - name: Run inference with 14k-15k token conversational prompt
        run: |
          python3 -c "
          with open('final_text.txt', 'r', encoding='utf-8') as f:
              long_text = f.read()
          prompt = long_text + '\n\nPlease summarize the main theme of this conversation in one sentence.'
          with open('prompt.txt', 'w', encoding='utf-8') as f:
              f.write(prompt)
          "
          echo \"=== Testing with ~14k-15k token conversational prompt ===\"
          # Use the mirror model name for inference
          time ollama run hf-mirror.com/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M < prompt.txt

      - name: Check memory usage and model info
        run: |
          echo "=== Ollama process memory usage ==="
          ps aux | grep ollama
          echo ""
          echo "=== Model info ==="
          ollama show hf-mirror.com/arcee-ai/Trinity-Nano-Preview-GGUF:Q4_K_M

      - name: Report context allocation
        run: |
          echo "=== Current context allocation ==="
          ollama ps
